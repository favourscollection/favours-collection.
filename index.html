<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Favour's Collection</title>
<meta name="description" content="Fashion and clothing, shoes and bags. Order on WhatsApp. Delivery across Nigeria.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<style id="css">
/* Layout: sticky header with section chips, bold intro with tilted photo stack, section tiles, one product grid per section, order steps, deep footer band. */
:root{
  --bg:#FFF4F7;--surface:#FFFFFF;--fg:#26101C;--muted:#7C5A6B;--line:#F0D2DD;
  --accent:#D90F58;--on-accent:#FFFFFF;--soft:#FFE3EC;--deep:#2E0C20;--on-deep:#FFEAF2;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 10px 30px rgba(120,20,60,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16090F;--surface:#22111A;--fg:#FCEAF1;--muted:#C79BB0;--line:#3A2230;
    --accent:#FF4F8B;--on-accent:#1A0610;--soft:#341624;--deep:#2B0F1E;--on-deep:#FFEAF2;
    --shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16090F;--surface:#22111A;--fg:#FCEAF1;--muted:#C79BB0;--line:#3A2230;
  --accent:#FF4F8B;--on-accent:#1A0610;--soft:#341624;--deep:#2B0F1E;--on-deep:#FFEAF2;
  --shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 15px/1 var(--body);padding:13px 20px;text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn.small{padding:11px 14px;font-size:14px;width:100%}
.btn.on-deep{background:var(--on-deep);color:var(--deep)}
.btn.line-deep{background:transparent;color:var(--on-deep);box-shadow:inset 0 0 0 1.5px var(--on-deep)}
.btn[disabled]{opacity:.55;cursor:default}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 8px}
.brand{font:800 22px/1 var(--display);letter-spacing:-.02em;text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;color:var(--fg);text-decoration:none;cursor:pointer;font-family:var(--body)}
.chip:hover{border-color:var(--accent)}

/* hero */
.hero{display:grid;gap:28px;padding-block:28px 40px;align-items:center}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(2.3rem,8vw,4.5rem);line-height:.98;letter-spacing:-.03em;font-weight:800;margin-top:10px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent) 62% 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding-inline:.08em}
.hero .lead{margin-top:18px;font-size:18px;color:var(--muted);max-width:34em}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;padding:0;list-style:none;font-size:14px;font-weight:600}
.trust li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px}
.stack{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin-inline:auto}
.tile{position:absolute;width:52%;aspect-ratio:4/5;border-radius:18px;border:4px solid var(--surface);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.t0{left:0;top:8%;transform:rotate(-6deg);z-index:1}
.tile.t1{right:0;top:0;transform:rotate(5deg);z-index:2}
.tile.t2{left:24%;bottom:0;transform:rotate(-2deg);z-index:3}
.tile.ph0{background:var(--accent);color:var(--on-accent)}
.tile.ph1{background:var(--deep);color:var(--on-deep)}
.tile.ph2{background:var(--soft);color:var(--accent)}
.tile svg{width:46%;height:auto}
.tile small{position:absolute;left:10px;bottom:8px;font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase}
.sticker{position:absolute;right:0;bottom:6%;width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;text-align:center;font:800 13px/1.15 var(--display);transform:rotate(12deg);z-index:4;padding:10px}

/* section headings */
.sec{padding-block:34px 8px;scroll-margin-top:120px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.sec-h .count{color:var(--muted);font-weight:600;font-size:14px}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{display:block;text-align:left;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;cursor:pointer;padding:0;color:var(--fg);font-family:var(--body)}
.cat:hover{border-color:var(--accent)}
.cat .cm{aspect-ratio:1/1;display:grid;place-items:center;background:var(--soft);color:var(--accent);overflow:hidden}
.cat .cm img{width:100%;height:100%;object-fit:cover;display:block}
.cat .cm svg{width:34%;height:auto}
.cat .ct{padding:10px 14px 14px;display:flex;flex-direction:column;gap:2px}
.cat .ct b{font:800 18px/1.15 var(--display)}
.cat .ct span{font-size:13px;color:var(--muted)}

/* search */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:12px 18px;font:500 16px var(--body)}
.search::placeholder{color:var(--muted)}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .media{display:block;width:100%;padding:0;border:0;background:var(--soft);aspect-ratio:4/5;cursor:zoom-in}
.card .media img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;top:10px;background:var(--accent);color:var(--on-accent);font:700 12px var(--body);letter-spacing:.04em;padding:5px 10px;border-radius:999px}
.badge.sold{background:var(--deep);color:var(--on-deep)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.info h4{font:600 16px/1.25 var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.price{font:800 20px var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .btn{margin-top:auto}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--display);font-size:18px;display:block}
.owner-note{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--soft);font-weight:600}
.nomatch{padding:18px 0;color:var(--muted)}

/* steps */
.steps{display:grid;gap:12px;grid-template-columns:1fr;padding:0;margin:0;list-style:none}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:flex-start;min-width:0}
.steps .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 17px var(--display)}
.steps b{font:800 18px var(--display);display:block;margin-bottom:2px}
.steps p{color:var(--muted);font-size:15px}

/* footer */
footer.foot{margin-top:44px;background:var(--deep);color:var(--on-deep)}
.foot-in{display:grid;gap:22px;padding-block:36px 44px}
.foot h2{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.02}
.foot p{opacity:.85}
.foot .num{font:800 22px var(--display);letter-spacing:.02em;user-select:all}
.foot .row{display:flex;flex-wrap:wrap;gap:10px}
.fine{font-size:13px;opacity:.7}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(20,6,13,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:16px}
.lbx{background:var(--surface);border-radius:20px;max-width:520px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column}
.lbx img{width:100%;max-height:62vh;object-fit:contain;background:var(--soft);display:block}
.lbx .lb-in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.lbx .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:680px;max-height:94%;display:flex;flex-direction:column;border-radius:22px 22px 0 0;box-shadow:var(--shadow)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h b{font:800 20px var(--display)}
.sheet-b{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet-b h3{font-size:19px;font-weight:800;margin-top:10px}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.msg{font-size:14px;color:var(--muted);flex:1;min-width:140px}
.msg.err{color:var(--accent);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 12px;font:500 16px var(--body)}
textarea.in{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box img{width:84px;height:104px;object-fit:cover;border-radius:12px;background:var(--soft);flex:none}
.photo-box .ph{width:84px;height:104px;border-radius:12px;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--accent);font-size:12px;text-align:center;padding:6px}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.prow img{width:52px;height:64px;object-fit:cover;border-radius:8px;background:var(--soft)}
.prow .pn{font-weight:700;overflow-wrap:anywhere}
.prow .pm{font-size:13px;color:var(--muted)}
.prow .pa{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:8px 14px;font:700 13px var(--body);cursor:pointer}
.mini.danger{color:var(--accent);border-color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:var(--shadow)}
.cartbar{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:var(--shadow)}
.fab .dot{width:9px;height:9px;border-radius:50%;background:#FFD54A;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:70;max-width:90%;text-align:center}

@media (min-width:640px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .cats{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:860px){
  .hero{grid-template-columns:1.1fr .9fr;gap:40px;padding-block:44px 56px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .foot-in{grid-template-columns:1.2fr 1fr;align-items:center}
  .overlay{align-items:center;padding:16px}
  .sheet{border-radius:22px;max-height:90%}
}
@media (prefers-reduced-motion:no-preference){
  .card,.cat,.btn,.chip{transition:transform .18s ease,border-color .18s ease,filter .18s ease}
  .card:hover,.cat:hover{transform:translateY(-3px)}
}
</style>
<div id="root"></div>
<script type="application/json" id="store-data">{"name":"Favour's Collection","intro":"Fashion and clothing, shoes and bags. Pick what you like and order straight on WhatsApp.","phone":"2348135327325","link":"","pay":{"bank":"","number":"","name":""},"cats":[{"id":"fashion","name":"Fashion & Clothing"},{"id":"shoes","name":"Shoes"},{"id":"bags","name":"Bags"}],"products":[]}</script>
<script id="app">
(function(){
  var S = JSON.parse(document.getElementById('store-data').textContent);
  var root = document.getElementById('root');
  var art = null, user = null, canManage = false, dirty = false;
  var editingId = null, pendingImg = null, photoBusy = false, confirmDel = null, panelOpen = false, lbId = null;
  var CL = '</scr' + 'ipt>';
  var FONTLINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">';
  var RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';

  root.innerHTML = '<div id="site"></div><div id="lb" class="overlay center" hidden></div><div id="panel" class="overlay" hidden></div><button id="cartBar" class="btn cartbar" data-act="openCart" hidden></button><button id="fab" class="btn fab" data-act="openPanel" hidden>Manage store <span class="dot" id="fabdot" hidden></span></button>';
  var siteEl = document.getElementById('site'), lbEl = document.getElementById('lb'), panelEl = document.getElementById('panel'), fab = document.getElementById('fab');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function naira(n){ var v = Number(n) || 0; var t; try { t = v.toLocaleString('en-NG'); } catch(e){ t = String(v); } return '₦' + t; }
  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section'; }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function normPhone(v){ var d = String(v || '').replace(/\D/g, ''); if (d.charAt(0) === '0') d = '234' + d.slice(1); return d; }
  function fmtPhone(p){ var m = /^234(\d{3})(\d{3})(\d{4})$/.exec(p); return m ? '+234 ' + m[1] + ' ' + m[2] + ' ' + m[3] : '+' + p; }
  function wa(text){ return 'https://wa.me/' + S.phone + (text ? '?text=' + encodeURIComponent(text) : ''); }
  function shareLink(){ return S.link || String(location.href).split('#')[0]; }
  function catById(id){ for (var i = 0; i < S.cats.length; i++) if (S.cats[i].id === id) return S.cats[i]; return null; }
  function prodsOf(cid){ return S.products.filter(function(p){ return p.cat === cid; }).sort(function(a, b){ return b.ts - a.ts; }); }
  function brandHTML(){
    var n = S.name, parts = n.split(' ');
    if (parts.length > 1) { var last = parts.pop(); return esc(parts.join(' ')) + ' <span>' + esc(last) + '</span>'; }
    return esc(n);
  }

  var GLYPH = {
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1 11H6L5 9z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>',
    slipper: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17v-2c0-3 2-5 5-5h5c4 0 8 1 8 5v2H3z"/><path d="M8 10c0-2 1-4 3-4"/></svg>',
    sweater: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4L3 8l2 4 3-1v9h8v-9l3 1 2-4-5-4c-1 2-5 2-8 0z"/></svg>',
    shoe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17v-6l4-1 3 3h6c3 0 5 1 5 4v1H3z"/><path d="M3 20h18"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 6 6.5.5-5 4.2 1.6 6.3L12 16.8 6.4 20l1.6-6.3-5-4.2 6.5-.5z"/></svg>'
  };
  function glyph(name){
    var n = String(name).toLowerCase();
    if (/bag|purse|tote/.test(n)) return GLYPH.bag;
    if (/slipper|slide|sandal/.test(n)) return GLYPH.slipper;
    if (/fashion|sweater|hoodie|cardigan|top|cloth|wear/.test(n)) return GLYPH.sweater;
    if (/shoe|sneaker|heel|boot/.test(n)) return GLYPH.shoe;
    return GLYPH.star;
  }

  function heroStack(){
    var withImg = S.products.slice().sort(function(a, b){ return b.ts - a.ts; }).filter(function(p){ return p.img; }).slice(0, 3);
    var out = '';
    for (var i = 0; i < 3; i++) {
      if (withImg[i]) out += '<div class="tile t' + i + '"><img src="' + esc(withImg[i].img) + '" alt="' + esc(withImg[i].name) + '"></div>';
      else {
        var c = S.cats[i % S.cats.length] || {name: 'New'};
        out += '<div class="tile t' + i + ' ph' + i + '">' + glyph(c.name) + '<small>' + esc(c.name) + '</small></div>';
      }
    }
    return '<div class="stack">' + out + '<div class="sticker">Delivery across Nigeria</div></div>';
  }

  function cardHTML(p){
    var now = Date.now(), fresh = (now - p.ts) < 14 * 86400000;
    var badge = p.sold ? '<span class="badge sold">Sold out</span>' : (fresh ? '<span class="badge">New</span>' : '');
    var msg = p.sold ? ('Hi, is "' + p.name + '" back in stock?') : ('Hi, I want to order: ' + p.name + ' (' + naira(p.price) + ')');
    return '<article class="card" data-name="' + esc((p.name + ' ' + (p.desc || '')).toLowerCase()) + '">' +
      '<button class="media" data-act="zoom" data-id="' + esc(p.id) + '" aria-label="View photo of ' + esc(p.name) + '"><img loading="lazy" src="' + esc(p.img) + '" alt="' + esc(p.name) + '"></button>' + badge +
      '<div class="info"><h4>' + esc(p.name) + '</h4><div class="price">' + naira(p.price) + '</div>' +
      (p.desc ? '<p class="desc">' + esc(p.desc) + '</p>' : '') +
      (p.sold ? '<a class="btn small" href="' + esc(wa(msg)) + '" target="_blank" rel="noopener">Ask when it is back</a>' : '<button class="btn small" data-act="add" data-id="' + esc(p.id) + '">Add to cart</button>') + '</div></article>';
  }

  function siteHTML(){
    var total = S.products.length;
    var chips = S.cats.map(function(c){ return '<a class="chip" href="#sec-' + esc(c.id) + '" data-go="sec-' + esc(c.id) + '">' + esc(c.name) + '</a>'; }).join('');

  function applySearch(){

    var secs = siteEl.querySelectorAll('[data-sec]');
    for (var i = 0; i < secs.length; i++) {
      var cards = secs[i].querySelectorAll('.card'), shown = 0;
      for (var j = 0; j < cards.length; j++) {
        var ok = !q || cards[j].getAttribute('data-name').indexOf(q) > -1;
        cards[j].hidden = !ok; if (ok) shown++;
      }
      var emp = secs[i].querySelector('[data-empty]');
      secs[i].hidden = q ? shown === 0 : false;
      if (q && shown) any = true;

  var orderCode = '';
  var NL = String.fromCharCode(10);
  function makeCode(){
    var d = new Date(), dd = ('0' + d.getDate()).slice(-2), mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = '', i, v;
    for (i = 0; i < 4; i++) {
      try { v = window.crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { v = Math.floor(Math.random() * 4294967296); }
      r += abc.charAt(v % abc.length);
    }
    return 'FC-' + dd + mm + '-' + r;
  }
  function loadLS(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function saveLS(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var cart = loadLS('fc_cart', {}), myOrders = loadLS('fc_orders', []), checkoutCode = '';

  function cartItems(){
    var out = [], id, p;
    for (id in cart) {
      p = S.products.filter(function(x){ return x.id === id; })[0];
      if (p && !p.sold && cart[id] > 0) out.push({p: p, q: cart[id]});
    }
    return out;
  }
  function cartCount(){ return cartItems().reduce(function(a, i){ return a + i.q; }, 0); }
  function cartTotal(){ return cartItems().reduce(function(a, i){ return a + i.q * (Number(i.p.price) || 0); }, 0); }
  function syncCartUI(){
    var n = cartCount(), els = document.querySelectorAll('.cartN'), i;
    for (i = 0; i < els.length; i++) els[i].textContent = n;
    var bar = document.getElementById('cartBar');
    if (bar) { bar.hidden = n === 0; bar.textContent = 'Cart (' + n + ') · ' + naira(cartTotal()); }
  }
  function addToCart(id){ cart[id] = Math.min((cart[id] || 0) + 1, 20); saveLS('fc_cart', cart); syncCartUI(); toast('Added to cart'); }
  function setQty(id, d){

  function closePanel(){ panelOpen = false; panelEl.hidden = true; panelEl.innerHTML = ''; }

  function compress(file){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onload = function(){
        var im = new Image();
        im.onload = function(){
          var max = 900, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.8));
        };
        im.onerror = rej; im.src = fr.result;
      };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }

  function saveProduct(){
    if (photoBusy) { setMsg('Wait a second, the photo is still processing.', true); return; }
    var name = document.getElementById('pName').value.trim();
    var price = Number(document.getElementById('pPrice').value);
    var catSel = document.getElementById('pCat').value;
    var desc = document.getElementById('pDesc').value.trim();
    var sold = document.getElementById('pSold').checked;
    var ed = editingId ? S.products.filter(function(p){ return p.id === editingId; })[0] : null;
    if (!name) { setMsg('Type the product name.', true); return; }
    if (!(price >= 0) || document.getElementById('pPrice').value === '') { setMsg('Type the price in naira.', true); return; }
    if (!ed && !pendingImg) { setMsg('Choose a photo for this product.', true); return; }
    var cid = catSel;
    if (ed) { ed.name = name; ed.price = price; ed.cat = cid; ed.desc = desc; ed.sold = sold; if (pendingImg) ed.img = pendingImg; }
    else S.products.push({id: uid('p'), name: name, price: price, cat: cid, desc: desc, sold: sold, img: pendingImg, ts: Date.now()});
    var wasEdit = !!ed;
    editingId = null; pendingImg = null; confirmDel = null;
    markDirty(); renderSite(); renderPanel();
    setMsg(wasEdit ? 'Saved here. Tap Publish to make it live.' : 'Added here. Add another, or tap Publish to make it live.', false);
  }

  function saveDetails(){
    var nm = document.getElementById('sName').value.trim();
    var ph = normPhone(document.getElementById('sPhone').value);
    if (!nm) { setMsg('The store needs a name.', true); return; }
    if (ph.length < 10) { setMsg('Check the WhatsApp number.', true); return; }
    S.name = nm; S.intro = document.getElementById('sIntro').value.trim() || S.intro; S.phone = ph;
    S.link = document.getElementById('sLink').value.trim();
    S.pay = {bank: document.getElementById('sBank').value.trim(), number: document.getElementById('sAcct').value.trim(), name: document.getElementById('sAcctName').value.trim()};
    markDirty(); renderSite(); renderPanel(); setMsg('Details saved here. Tap Publish to make them live.', false);
  }

  function buildDoc(){
    var css = document.getElementById('css').textContent;
    var app = document.getElementById('app').textContent;
    var json = JSON.stringify(S).replace(/</g, '\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>' + esc(S.name) + '</title>' + FONTLINK + '<style id="css">' + css + '</style><div id="root"></div>' +
      '<script type="application/json" id="store-data">' + json + CL +
      '<script id="app">' + app + CL + '</body></html>';
  }

  function publish(){
    if (!art) { setMsg('Publishing is not available in this view.', true); return; }
    var html = buildDoc();
    if (html.length > 15500000) { setMsg('The page is getting too big. Delete a few old products and try again.', true); return; }
    var btn = document.getElementById('pubBtn'); if (btn) btn.disabled = true;
    setMsg('Publishing...', false);
    art.publish(html).then(function(){ dirty = false; setMsg('Published. Reloading...', false); }).catch(function(e){
      if (btn) btn.disabled = false;
      var c = e && e.code;
      if (c === 'not_writer' || c === 'not_granted') setMsg('This account cannot edit the store. Open the page from the account that made it.', true);
      else if (c === 'conflict') setMsg('A newer version was published. The page is reloading.', false);
      else if (c === 'rate_limited') setMsg('Too many saves. Wait a moment, then publish once.', true);
      else if (c === 'too_large') setMsg('The page is too big. Delete a few old products and try again.', true);
      else setMsg('Could not publish. Check your connection and try again.', true);
    });
  }

  function copyLink(){
    var l = shareLink();
    function fb(){ toast(l); }
    try { navigator.clipboard.writeText(l).then(function(){ toast('Store link copied'); }, fb); } catch (e) { fb(); }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var go = e.target.closest('[data-go]');
    if (go) {
      e.preventDefault();
      var el = document.getElementById(go.getAttribute('data-go'));
      if (el) { try { el.scrollIntoView({behavior: 'smooth', block: 'start'}); } catch (x) { el.scrollIntoView(); } }
      return;
    }
    if (e.target === lbEl) { hideLb(); return; }
    if (e.target === panelEl) { closePanel(); return; }
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act === 'zoom') showLb(id);
    else if (act === 'add') { addToCart(id); if (!lbEl.hidden) hideLb(); }
    else if (act === 'openCart') viewCart();
    else if (act === 'checkout') viewCheckout();
    else if (act === 'qty') setQty(id, Number(t.getAttribute('data-d')) || 0);
    else if (act === 'placeOrder') placeOrder(e);
    else if (act === 'myOrders') viewOrders();
    else if (act === 'receipt') viewReceipt(id);
    else if (act === 'copyAcct') copyAcct();
    else if (act === 'closeLb') hideLb();
    else if (act === 'openPanel') openPanel();
    else if (act === 'closePanel') closePanel();
    else if (act === 'saveProduct') saveProduct();
    else if (act === 'cancelEdit') { editingId = null; pendingImg = null; renderPanel(); }
    else if (act === 'edit') { editingId = id; pendingImg = null; renderPanel(); var sb = panelEl.querySelector('.sheet-b'); if (sb) sb.scrollTop = 0; }
    else if (act === 'sold') { var p = S.products.filter(function(x){ return x.id === id; })[0]; if (p) { p.sold = !p.sold; markDirty(); renderSite(); renderPanel(); } }
    else if (act === 'del') {
      if (confirmDel === id) { S.products = S.products.filter(function(x){ return x.id !== id; }); confirmDel = null; if (editingId === id) editingId = null; markDirty(); renderSite(); renderPanel(); }
      else { confirmDel = id; renderPanel(); }
    }
    else if (act === 'rmcat') { S.cats = S.cats.filter(function(c){ return c.id !== id; }); markDirty(); renderSite(); renderPanel(); }
    else if (act === 'saveDetails') saveDetails();
    else if (act === 'publish') publish();
    else if (act === 'copyLink') copyLink();
  });
  document.addEventListener('input', function(e){
    if (!e.target) return;
    if (e.target.id === 'q') applySearch();
    if (e.target.id === 'oName' || e.target.id === 'oAddr') refreshSendLink();
  });
  document.addEventListener('change', function(e){
    var t = e.target; if (!t) return;
    if (t.id === 'pPhoto' && t.files && t.files[0]) {
      photoBusy = true; setMsg('Processing photo...', false);
      compress(t.files[0]).then(function(url){
        pendingImg = url; photoBusy = false; setMsg('Photo ready.', false);
        var pv = document.getElementById('pPrev'), ph = document.getElementById('pPrevPh');
        if (pv) pv.src = url;
        else if (ph) { var im = document.createElement('img'); im.id = 'pPrev'; im.alt = 'Photo preview'; im.src = url; ph.parentNode.replaceChild(im, ph); }
      }).catch(function(){ photoBusy = false; setMsg('That photo could not be read. Try another one.', true); });
    }
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { if (!lbEl.hidden) hideLb(); else if (panelOpen) closePanel(); } });

  /* ---------- who is viewing ---------- */
  function checkOwner(){
    var hashOk = (location.hash || '') === '#manage';
    if (!art) return;
    if (!user) { canManage = hashOk; fab.hidden = !canManage; return; }
    var a, b;
    try { a = user.isOwner(); } catch (e) { a = false; }
    try { b = user.canEdit(); } catch (e) { b = false; }
    Promise.all([Promise.resolve(a), Promise.resolve(b)]).then(function(r){
      canManage = !!(r[0] || r[1]);
      fab.hidden = !canManage;
      renderSite();
    }).catch(function(){});
  }

  renderSite();
  syncCartUI();
  if (window.claude && claude.use) {
    claude.use('artifact').then(function(a){ art = a; checkOwner(); }).catch(function(){});
    claude.use('user').then(function(u){ user = u; checkOwner(); }).catch(function(){});
  }
})();
</script>
</body>
</html>
